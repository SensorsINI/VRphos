[project]
name = "vrphos-tools"
version = "1.0.0"
description = "VRphos PC tools: stimulation server, layout generator, tool packs, benchmark"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
dependencies = [
    "numpy>=2.0",
    "opencv-python>=4.10",
    "PyYAML>=6.0",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "torch>=2.5",
    "dynaphos==0.1.3",          # phosphene model; utils/dynaphos/ adds the fast "lite" simulator
    # vrphos_server.py
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "ultralytics>=8.3",         # YOLO segmentation
    # tool_packs/
    "onnx>=1.16",
    "onnxruntime>=1.19",
]

[tool.uv]
package = false   # a folder of scripts, not an installable package
